kind = "web"
previewPath = "/"
title = "Trattoria Joseppe"
version = "1.0.0"
id = "artifacts/trattoria-joseppe"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/trattoria-joseppe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trattoria-joseppe", "run", "build" ]
publicDir = "artifacts/trattoria-joseppe/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
